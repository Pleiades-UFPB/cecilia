[project]
name = "cecilia"
version = "0.1.0"
description = "Classificação estelar e asterossismologia com ML sobre Gaia DR3, LAMOST e APOKASC-3"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "astropy",
    "astroquery",
    "scikit-learn",
    "xgboost",
    "imbalanced-learn",
    "shap",
    "matplotlib",
    "plotly",
]

[dependency-groups]
dev = ["pytest", "ruff", "jupyterlab"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cecilia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
# Framework PAUL de terceiros e estado gerenciado pelo PAUL: o ruff não deve reformatar
# (a partir do ruff 0.16 ele também formata blocos de código em Markdown).
extend-exclude = [".claude", ".paul"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
