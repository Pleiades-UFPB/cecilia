[project]
name = "cecilia"
version = "0.1.0"
description = "Classificação estelar e asterossismologia com ML sobre Gaia DR3, LAMOST e APOKASC-3"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "astropy",
    "astroquery",
    "scikit-learn",
    "xgboost",
    "imbalanced-learn",
    "shap",
    "matplotlib",
    "plotly",
]

[dependency-groups]
dev = ["pytest", "ruff", "jupyterlab"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cecilia"]

[tool.ruff]
line-length = 100
